name: Publish Zimbra Phishing Reporter 2.1.2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, '[publish-v2.1.2]')
    runs-on: ubuntu-latest
    env:
      TAG: v2.1.2
      TARGET_SHA: a9867ac9f622e341810fecb4fa61625114858fd1
      CLASSIC_ZIP: dist/org_zimbracommunity_phishing_reporter_classic.zip
      MODERN_ZIP: dist/org_zimbracommunity_phishing_reporter_modern.zip
      SUMS_FILE: dist/SHA256SUMS

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release target, tests and committed packages
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse "${GITHUB_SHA}^")" = "$TARGET_SHA"
          git cat-file -e "$TARGET_SHA^{commit}"

          node --check classic/org_zimbracommunity_phishing_reporter_classic.js
          node --check modern/index.js
          node tests/detection-test.js
          node tests/modern-timeout-test.js

          (
            cd dist
            sha256sum -c SHA256SUMS
            unzip -t org_zimbracommunity_phishing_reporter_classic.zip
            unzip -t org_zimbracommunity_phishing_reporter_modern.zip
          )

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          mkdir -p "$tmpdir/classic" "$tmpdir/modern"
          unzip -q "$CLASSIC_ZIP" -d "$tmpdir/classic"
          unzip -q "$MODERN_ZIP" -d "$tmpdir/modern"

          for file in             org_zimbracommunity_phishing_reporter_classic.properties             org_zimbracommunity_phishing_reporter_classic_de.properties             org_zimbracommunity_phishing_reporter_classic.xml             org_zimbracommunity_phishing_reporter_classic.css             org_zimbracommunity_phishing_reporter_classic.js             shield-alert-16.png             config_template.xml
          do
            cmp "classic/$file" "$tmpdir/classic/$file"
          done

          for file in             org_zimbracommunity_phishing_reporter_modern.properties             org_zimbracommunity_phishing_reporter_modern_de.properties             org_zimbracommunity_phishing_reporter_modern.xml             index.js             config_template.xml
          do
            cmp "modern/$file" "$tmpdir/modern/$file"
          done

          grep -q 'version="2.1.1"' "$tmpdir/classic/org_zimbracommunity_phishing_reporter_classic.xml"
          grep -q 'version="2.1.2"' "$tmpdir/modern/org_zimbracommunity_phishing_reporter_modern.xml"

      - name: Create tag and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$TARGET_SHA" -m "Zimbra Phishing Reporter 2.1.2"
          git push origin "refs/tags/$TAG"

          cat > /tmp/release-notes.md <<'EOF'
          ## Zimbra Phishing Reporter 2.1.2

          This bugfix release prevents the Modern reporter from remaining permanently busy when Zimbra client promises do not settle.

          ### Fixed

          - bounds Modern `SendMsg`, move, refresh and complete-report operations with configurable timeouts
          - always releases the Modern busy state after success, failure or timeout
          - replaces the browser-session message lock with a configurable, time-limited cooldown
          - keeps a short uncertainty cooldown after send timeouts to prevent accidental duplicate reports
          - displays clear, non-technical timeout messages with stable support references
          - adds regression coverage for stalled sends, stalled moves, cooldown expiry and successful retry
          - keeps the Classic reporting flow and Classic package unchanged from 2.1.1
          - retains safe package defaults without recipients or organization-specific settings

          ### Downloads

          - Classic Zimlet package (unchanged 2.1.1 package)
          - Modern Zimlet package 2.1.2
          - `SHA256SUMS` for integrity verification
          EOF

          gh release create "$TAG"             "$CLASSIC_ZIP"             "$MODERN_ZIP"             "$SUMS_FILE"             --title "Zimbra Phishing Reporter 2.1.2"             --notes-file /tmp/release-notes.md             --verify-tag             --repo "$GITHUB_REPOSITORY"

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
